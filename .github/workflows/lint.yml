# Fast checks on every push: the scripts with ShellCheck, the PHP tools parsed by each PHP they
# claim to run on, and gen/check.py (the facts' floors and known facts, and that the scripts name
# one release). The end-to-end suites in preflight/test_*.sh need several minutes and Docker Hub
# images each, so they run locally before a release, not here.
name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck, warnings and errors
        run: shellcheck --version | head -2 && shellcheck -S warning preflight/*.sh release.sh

  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The doctor supports PHP 5.4 and later; 5.4's image can no longer be pulled, so 5.5 is the oldest checked.
        php: ['5.5', '5.6', '7.0', '7.4', '8.1', '8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: openemr-doctor.php parses on PHP ${{ matrix.php }}
        run: docker run --rm -v "$PWD:/app" -w /app php:${{ matrix.php }}-cli php -l preflight/openemr-doctor.php
      - name: openemr-preflight.php parses on PHP ${{ matrix.php }} (it needs 7.4 or later)
        if: ${{ !contains(fromJSON('["5.5", "5.6", "7.0"]'), matrix.php) }}
        run: docker run --rm -v "$PWD:/app" -w /app php:${{ matrix.php }}-cli php -l preflight/openemr-preflight.php

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gen/check.py
        run: python3 gen/check.py
