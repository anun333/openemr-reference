# Throwaway OpenEMR 7.0.3 for test_preflight.sh. Demo credentials only; deleted after the test.
services:
  mysql:
    image: mariadb:10.6
    command: ['mysqld', '--character-set-server=utf8mb4']
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 40
  openemr:
    image: openemr/openemr:7.0.3
    tmpfs:
      - /tinybackup:size=1m
    ports:
      - "127.0.0.1:8371:80"
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: root
      MYSQL_USER: openemr
      MYSQL_PASS: openemr
      OE_USER: admin
      OE_PASS: pass
    depends_on:
      mysql:
        condition: service_healthy
