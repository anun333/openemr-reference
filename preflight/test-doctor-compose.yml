# Throwaway OpenEMR 8.4.1 for test_doctor.sh. Demo credentials only; deleted after the test.
services:
  mysql:
    image: mariadb:11.8
    command: ['mariadbd', '--character-set-server=utf8mb4']
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 40
  openemr:
    image: openemr/openemr:8.4.1
    ports:
      - "127.0.0.1:8372:80"
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: root
      MYSQL_USER: openemr
      MYSQL_PASS: openemr
      OE_USER: admin
      OE_PASS: pass
    depends_on:
      mysql:
        condition: service_healthy
